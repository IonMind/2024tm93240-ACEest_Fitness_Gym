<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | ACEest Fitness</title>
    <style>
        :root { color-scheme: light; --ink: #263238; --muted: #65727a; --paper: #f7f8f8; --line: #d9e0e3; --accent: #b57b19; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font-family: Arial, sans-serif; }
        main { width: min(420px, calc(100% - 2rem)); padding: 2rem; background: white; border: 1px solid var(--line); border-radius: 5px; }
        h1 { margin-top: 0; font-size: 1.6rem; }
        p { color: var(--muted); line-height: 1.5; }
        label { display: block; margin: 1rem 0 .35rem; font-size: .85rem; font-weight: 700; }
        input { width: 100%; padding: .7rem; border: 1px solid var(--line); border-radius: 4px; font: inherit; }
        button { margin-top: 1.25rem; padding: .7rem 1.1rem; border: 0; border-radius: 4px; background: var(--accent); color: white; font: inherit; font-weight: 700; cursor: pointer; }
        .error { color: #a12d2d; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>ACEest Fitness &amp; Gym</h1>
        <p>Sign in to manage client profiles, workouts, and progress.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form method="post" action="{{ url_for('login') }}">
            <label for="username">Username</label>
            <input id="username" name="username" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
